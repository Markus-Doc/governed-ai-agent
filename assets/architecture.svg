<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="1520" height="920" font-family="'Schibsted Grotesk', 'Segoe UI', Arial, sans-serif" font-size="13" role="img" aria-label="One agent step, wrapped in code that checks it">
  <rect width="760" height="460" fill="#FBF7EE"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B723B"/></marker>
  </defs>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1F2B26">One agent step, wrapped in code that checks it</text>
  <g fill="none" stroke="#8B723B" stroke-width="1.25">
    <path d="M236 92H274" marker-end="url(#arrow)"/>
    <path d="M130 128V176" marker-end="url(#arrow)"/>
    <path d="M350 128V212" marker-end="url(#arrow)"/>
    <path d="M410 212V128" marker-end="url(#arrow)"/>
    <path d="M630 128V212" marker-end="url(#arrow)"/>
    <path d="M248 256H276" marker-end="url(#arrow)"/>
    <path d="M484 256H512" marker-end="url(#arrow)"/>
    <path d="M628 300V364" marker-end="url(#arrow)"/>
    <path d="M540 300V340H388V364" marker-end="url(#arrow)"/>
  </g>
  <g font-size="11.5" fill="#46534C">
    <text x="138" y="156">starts a run</text>
    <text x="342" y="156" text-anchor="end">reads</text>
    <text x="418" y="156">writes back</text>
    <text x="622" y="156" text-anchor="end">decrypted per run</text>
  </g>
  <g>
    <rect x="24" y="56" width="212" height="72" rx="8" fill="none" stroke="#8B723B" stroke-width="1.25"/>
    <text x="130" y="80" text-anchor="middle" font-weight="600" fill="#1F2B26">Console</text>
    <text x="130" y="98" text-anchor="middle" font-size="11.5" fill="#46534C">Cloudflare Worker</text>
    <text x="130" y="114" text-anchor="middle" font-size="11.5" fill="#46534C">behind Cloudflare Access</text>
  </g>
  <g>
    <rect x="274" y="56" width="212" height="72" rx="8" fill="none" stroke="#8B723B" stroke-width="1.25"/>
    <text x="380" y="80" text-anchor="middle" font-weight="600" fill="#1F2B26">Knowledge base</text>
    <text x="380" y="98" text-anchor="middle" font-size="11.5" fill="#46534C">OKF v0.2 markdown in Git</text>
    <text x="380" y="114" text-anchor="middle" font-size="11.5" fill="#46534C">rules, procedures, voice</text>
  </g>
  <g>
    <rect x="524" y="56" width="212" height="72" rx="8" fill="none" stroke="#8B723B" stroke-width="1.25"/>
    <text x="630" y="80" text-anchor="middle" font-weight="600" fill="#1F2B26">Private records</text>
    <text x="630" y="98" text-anchor="middle" font-size="11.5" fill="#46534C">age-encrypted repo</text>
    <text x="630" y="114" text-anchor="middle" font-size="11.5" fill="#46534C">read-only deploy key</text>
  </g>
  <rect x="24" y="176" width="712" height="140" rx="8" fill="#F1E8D6" stroke="#8B723B" stroke-width="1.25"/>
  <text x="40" y="200" font-weight="600" fill="#1F2B26">Apply run on GitHub Actions</text>
  <g>
    <rect x="40" y="212" width="208" height="88" rx="8" fill="#FBF7EE" stroke="#8B723B" stroke-width="1.25"/>
    <text x="144" y="236" text-anchor="middle" font-weight="600" fill="#1F2B26">1. Plan</text>
    <text x="144" y="254" text-anchor="middle" font-size="11.5" fill="#46534C">T0 code, no model call</text>
    <text x="144" y="270" text-anchor="middle" font-size="11.5" fill="#46534C">policy, cap, fingerprints</text>
    <text x="144" y="286" text-anchor="middle" font-size="11.5" fill="#46534C">trusted copy kept off-repo</text>
  </g>
  <g>
    <rect x="276" y="212" width="208" height="88" rx="8" fill="#E9E6D3" stroke="#274931" stroke-width="2"/>
    <text x="380" y="236" text-anchor="middle" font-weight="600" fill="#1F2B26">2. Draft</text>
    <text x="380" y="254" text-anchor="middle" font-size="11.5" fill="#1F2B26">Claude Code, headless</text>
    <text x="380" y="270" text-anchor="middle" font-size="11.5" fill="#1F2B26">follows the KB procedure</text>
    <text x="380" y="286" text-anchor="middle" font-size="11.5" fill="#1F2B26">gates every claim</text>
  </g>
  <g>
    <rect x="512" y="212" width="208" height="88" rx="8" fill="#FBF7EE" stroke="#8B723B" stroke-width="1.25"/>
    <text x="616" y="236" text-anchor="middle" font-weight="600" fill="#1F2B26">3. Finish</text>
    <text x="616" y="254" text-anchor="middle" font-size="11.5" fill="#46534C">T0 code and a browser</text>
    <text x="616" y="270" text-anchor="middle" font-size="11.5" fill="#46534C">re-check, render, sign off</text>
    <text x="616" y="286" text-anchor="middle" font-size="11.5" fill="#46534C">submit, or stop with reason</text>
  </g>
  <g>
    <rect x="280" y="364" width="216" height="72" rx="8" fill="none" stroke="#8B723B" stroke-width="1.25"/>
    <text x="388" y="388" text-anchor="middle" font-weight="600" fill="#1F2B26">Cloudflare R2</text>
    <text x="388" y="406" text-anchor="middle" font-size="11.5" fill="#46534C">private bucket for outputs</text>
    <text x="388" y="422" text-anchor="middle" font-size="11.5" fill="#46534C">console serves downloads</text>
  </g>
  <g>
    <rect x="520" y="364" width="216" height="72" rx="8" fill="none" stroke="#8B723B" stroke-width="1.25"/>
    <text x="628" y="388" text-anchor="middle" font-weight="600" fill="#1F2B26">Target web forms</text>
    <text x="628" y="406" text-anchor="middle" font-size="11.5" fill="#46534C">many employers' job forms</text>
    <text x="628" y="422" text-anchor="middle" font-size="11.5" fill="#46534C">stops at any CAPTCHA</text>
  </g>
</svg>
